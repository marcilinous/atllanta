<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atllanta — Reset password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2563EB">
<style>
  .login-page { min-height: 100vh; display: grid; place-items: center; background: var(--color-bg-secondary); padding: var(--space-6); }
  .login-card { width: 100%; max-width: 400px; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-xl); padding: var(--space-10) var(--space-8); box-shadow: var(--shadow-lg); }
  .login-logo { width: 44px; height: 44px; display: grid; place-items: center; background: var(--color-accent); color: var(--color-text-inverse); font-weight: 700; font-size: 22px; border-radius: var(--radius-lg); margin-bottom: var(--space-5); }
  .login-title { font-size: var(--text-2xl); font-weight: var(--font-weight-bold); margin-bottom: var(--space-1); }
  .login-subtitle { font-size: var(--text-sm); color: var(--color-text-secondary); margin-bottom: var(--space-8); }
  .login-form { display: flex; flex-direction: column; gap: var(--space-4); }
  .login-form label { display: block; font-size: var(--text-sm); font-weight: var(--font-weight-medium); color: var(--color-text-primary); margin-bottom: var(--space-1); }
  .login-form input { display: block; width: 100%; padding: var(--space-2) var(--space-3); border: 1px solid var(--color-border); border-radius: var(--radius-md); font-size: var(--text-base); color: var(--color-text-primary); background: var(--color-bg); transition: border-color var(--transition-fast); height: 40px; }
  .login-form input:focus { outline: none; border-color: var(--color-accent); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
  .login-form input::placeholder { color: var(--color-text-tertiary); }
  .login-btn { display: flex; align-items: center; justify-content: center; width: 100%; height: 42px; background: var(--color-accent); color: var(--color-text-inverse); border: none; border-radius: var(--radius-md); font-size: var(--text-base); font-weight: var(--font-weight-semibold); cursor: pointer; transition: background var(--transition-fast); margin-top: var(--space-2); }
  .login-btn:hover { background: var(--color-accent-hover); }
  .login-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .login-error { font-size: var(--text-sm); color: var(--color-error); background: var(--color-error-light); padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); margin-top: var(--space-2); }
  .login-success { font-size: var(--text-sm); color: var(--color-success); background: var(--color-success-light); padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); margin-top: var(--space-2); }
  .login-footer { text-align: center; margin-top: var(--space-6); font-size: var(--text-sm); color: var(--color-text-tertiary); }
  .login-footer a { color: var(--color-accent); font-weight: var(--font-weight-medium); }
</style>
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">A</div>
    <h1 class="login-title">Set a new password</h1>
    <p class="login-subtitle" id="rp-sub">Choose a new password for your Atllanta account.</p>

    <form id="rp-form" class="login-form">
      <div>
        <label for="rp-password">New password</label>
        <input type="password" id="rp-password" autocomplete="new-password" required minlength="6" placeholder="Min 6 characters">
      </div>
      <div>
        <label for="rp-confirm">Confirm new password</label>
        <input type="password" id="rp-confirm" autocomplete="new-password" required minlength="6" placeholder="Re-enter password">
      </div>
      <button type="submit" class="login-btn" id="rp-btn">Update password</button>
      <div id="rp-error" class="login-error hidden"></div>
      <div id="rp-success" class="login-success hidden"></div>
    </form>

    <div class="login-footer"><a href="/login">← Back to sign in</a></div>
  </div>
</div>

<script>
  const t = localStorage.getItem('atllanta-theme');
  if (t) document.documentElement.setAttribute('data-theme', t);
</script>
<script src="/js/config.js"></script>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const cfg = window.ATLLANTA_CONFIG;
const sb = createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);

const form = document.getElementById('rp-form');
const errEl = document.getElementById('rp-error');
const okEl = document.getElementById('rp-success');

// The recovery link lands here with tokens in the URL. supabase-js parses them
// on load (detectSessionInUrl) and fires PASSWORD_RECOVERY, giving us a
// short-lived session that authorises updateUser().
let ready = false;
sb.auth.onAuthStateChange((event, session) => {
  if (event === 'PASSWORD_RECOVERY' || session) ready = true;
});
const { data: { session } } = await sb.auth.getSession();
if (session) ready = true;

if (!ready) {
  document.getElementById('rp-sub').textContent =
    'Open this page from the reset link in your email. If the link has expired, request a new one from the sign-in page.';
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errEl.classList.add('hidden'); okEl.classList.add('hidden');

  const pw = document.getElementById('rp-password').value;
  const confirm = document.getElementById('rp-confirm').value;
  if (pw !== confirm) {
    errEl.textContent = "The two passwords don't match.";
    errEl.classList.remove('hidden');
    return;
  }
  if (!ready) {
    errEl.textContent = 'This reset link is invalid or has expired. Request a new one from the sign-in page.';
    errEl.classList.remove('hidden');
    return;
  }

  const btn = document.getElementById('rp-btn');
  btn.disabled = true; btn.textContent = 'Updating…';
  const { error } = await sb.auth.updateUser({ password: pw });
  btn.disabled = false; btn.textContent = 'Update password';

  if (error) {
    errEl.textContent = error.message;
    errEl.classList.remove('hidden');
    return;
  }
  okEl.textContent = 'Password updated. Redirecting you to sign in…';
  okEl.classList.remove('hidden');
  await sb.auth.signOut();
  setTimeout(() => { window.location.href = '/login'; }, 1600);
});
</script>
</body>
</html>
